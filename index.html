<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle - Conversa de Texto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* TOPO / LOGO */
        header {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
        }

        .omegle-logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #000;
            font-family: Georgia, serif;
        }

        .omegle-logo span {
            color: #2b6cb0;
        }

        /* ÁREA PRINCIPAL DO CHAT */
        .chatbox-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .log-container {
            flex: 1;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.95rem;
            max-height: calc(100vh - 250px);
        }

        .log-message {
            line-height: 1.4;
        }

        .log-message.status {
            color: #7f8c8d;
            font-style: italic;
        }

        .log-message.stranger {
            color: red;
            font-weight: bold;
        }

        .log-message.you {
            color: blue;
            font-weight: bold;
        }

        /* ÁREA DE CONTROLE E INPUT */
        .control-area {
            display: flex;
            margin-top: 15px;
            gap: 10px;
            align-items: center;
        }

        .btn-disconnect {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-disconnect:hover {
            background-color: #c53030;
        }

        .chat-input {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .chat-input textarea {
            flex: 1;
            height: 50px;
            resize: none;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            outline: none;
        }

        .chat-input textarea:focus {
            border-color: #2b6cb0;
        }

        .btn-send {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 0 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-send:hover {
            background-color: #2c5282;
        }
    </style>
</head>
<body>

    <header>
        <div class="omegle-logo">Omegle <span>clone</span></div>
    </header>

    <div class="chatbox-wrapper">
        <!-- Histórico de Conversas (Estilo Clássico) -->
        <div class="log-container" id="logContainer">
            <div class="log-message status">Conectando ao servidor...</div>
            <div class="log-message status">Você está conectado com um estranho. Diga oi!</div>
        </div>

        <!-- Botão de Sair/Pular e Caixa de Texto -->
        <div class="control-area">
            <button class="btn-disconnect" id="btnNext">Escape / Pular</button>
            <div class="chat-input">
                <textarea id="messageInput" placeholder="Digite sua mensagem aqui..."></textarea>
                <button class="btn-send" id="btnSend">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('logContainer');
        const messageInput = document.getElementById('messageInput');
        const btnSend = document.getElementById('btnSend');
        const btnNext = document.getElementById('btnNext');

        function addLog(text, type = 'status') {
            const div = document.createElement('div');
            div.classList.add('log-message', type);
            div.innerHTML = text;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function enviarMensagem() {
            const texto = messageInput.value.trim();
            if (texto !== "") {
                addLog(`Você: ${texto}`, 'you');
                messageInput.value = "";
                
                // Simulação de resposta automática só para teste visual
                setTimeout(() => {
                    addLog(`Estranho: Olá! Recebi sua mensagem: "${texto}"`, 'stranger');
                }, 1000);
            }
        }

        btnSend.addEventListener('click', enviarMensagem);
        
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        });

        btnNext.addEventListener('click', function() {
            logContainer.innerHTML = "";
            addLog("Você conversou com alguém. A conversa foi encerrada.", 'status');
            addLog("Procurando um novo estranho...", 'status');
            setTimeout(() => {
                addLog("Conectado a um novo estranho!", 'status');
            }, 1500);
        });
    </script>

</body>
</html>
