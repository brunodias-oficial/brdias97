<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Fotos Comunitário</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* FORMULÁRIO DE POSTAGEM */
        .post-form {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-form input, .post-form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .post-form input:focus, .post-form textarea:focus {
            border-color: var(--primary);
        }

        .post-form button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .post-form button:hover {
            background-color: var(--primary-hover);
        }

        /* FEED DE FOTOS */
        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .photo-post {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .post-author {
            padding: 12px 15px;
            font-weight: bold;
            font-size: 0.95rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .photo-post img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            display: block;
        }

        .post-content {
            padding: 15px;
        }

        .post-content p {
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        /* ÁREA DE COMENTÁRIOS */
        .comments-section {
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .comment {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .comment-input-box {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .comment-input-box input {
            flex: 1;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .comment-input-box button {
            background: #e2e8f0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .comment-input-box button:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Mural Livre</h1>
            <p>Poste sua foto, deixe sua legenda e veja o que os outros estão compartilhando!</p>
        </header>

        <!-- Formulário para postar -->
        <div class="post-form">
            <input type="text" placeholder="Seu nome ou apelido" id="authorInput">
            <input type="text" placeholder="Link da imagem (URL da foto)" id="imageInput">
            <textarea placeholder="Escreva uma legenda..." id="captionInput" rows="2"></textarea>
            <button id="postBtn">Publicar Foto</button>
        </div>

        <!-- Onde as fotos vão aparecer -->
        <div class="feed" id="feedContainer">
            
            <!-- Exemplo de Post -->
            <div class="photo-post">
                <div class="post-author">João Silva</div>
                <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809" alt="Exemplo">
                <div class="post-content">
                    <p>Curtindo ovisual de hoje por aqui! O que acharam?</p>
                    
                    <div class="comments-section">
                        <div class="comment"><strong>Maria:</strong> Que foto linda!</div>
                        <div class="comment"><strong>Carlos:</strong> Show demais mano!</div>
                        
                        <div class="comment-input-box">
                            <input type="text" placeholder="Escreva um comentário...">
                            <button>Comentar</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
