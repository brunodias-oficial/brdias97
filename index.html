<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bate-Papo Anônimo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: var(--chat-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #334155;
        }

        /* CABEÇALHO DO CHAT */
        .chat-header {
            padding: 15px 20px;
            background-color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .status {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .status span {
            color: #22c55e;
            font-weight: bold;
        }

        .btn-next {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #dc2626;
        }

        /* CAIXA DE MENSAGENS */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.system {
            background-color: #334155;
            color: var(--text-muted);
            text-align: center;
            max-width: 100%;
            font-size: 0.85rem;
        }

        .message.incoming {
            background-color: #334155;
            align-self: flex-start;
        }

        .message.outgoing {
            background-color: var(--accent);
            align-self: flex-end;
        }

        /* ÁREA DE DIGITAÇÃO */
        .chat-input-area {
            padding: 15px;
            background-color: #0f172a;
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
        }

        .chat-input-area button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Topo -->
        <div class="chat-header">
            <div class="status">Status: <span>Procurando conversa...</span></div>
            <button class="btn-next">Pular / Sair</button>
        </div>

        <!-- Mensagens -->
        <div class="chat-messages" id="messageBox">
            <div class="message system">Você está conectado com um estranho. Diga oi!</div>
            <div class="message incoming">Olá! Tudo bem?</div>
            <div class="message outgoing">Tudo ótimo! E com você?</div>
        </div>

        <!-- Digitação -->
        <div class="chat-input-area">
            <input type="tecla" placeholder="Digite sua mensagem..." id="messageInput">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        // Pequena lógica visual de exemplo para envio de mensagem
        const messageBox = document.getElementById('messageBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function enviarMensagem() {
            const texto = messageInput.value.trim();
            if (texto !== "") {
                const novaMsg = document.createElement('div');
                novaMsg.classList.add('message', 'outgoing');
                novaMsg.textContent = texto;
                messageBox.appendChild(novaMsg);
                messageInput.value = "";
                messageBox.scrollTop = messageBox.scrollHeight; // Rola para o fim
            }
        }

        sendBtn.addEventListener('click', enviarMensagem);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enviarMensagem();
            }
        });
    </script>

</body>
</html>
