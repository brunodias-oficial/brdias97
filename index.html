<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle Vídeo - Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 12px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: Georgia, serif;
        }

        header span {
            color: #2b6cb0;
        }

        /* ÁREA DOS VÍDEOS (Lado a lado) */
        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .video-box {
            width: 45%;
            height: 70vh;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Elemento de vídeo real */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Espelha a câmera para ficar natural */
        }

        .video-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        /* BOTÕES DE CONTROLE */
        .controls {
            padding: 15px;
            display: flex;
            justify-content: center;
            background: #fff;
            border-top: 1px solid #ddd;
        }

        .btn-next {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #c53030;
        }
    </style>
</head>
<body>

    <header>
        Omegle <span>Video Clone</span>
    </header>

    <!-- Espaço dos dois vídeos -->
    <div class="video-container">
        <!-- Vídeo da outra pessoa -->
        <div class="video-box">
            <div class="video-label">Estranho</div>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- Seu próprio vídeo -->
        <div class="video-box">
            <div class="video-label">Você</div>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- Botão de Pular -->
    <div class="controls">
        <button class="btn-next" id="btnNext">Escape / Novo</button>
    </div>

    <script>
        // Código JavaScript básico para ligar a SUA webcam na tela
        const localVideo = document.getElementById('localVideo');

        async function iniciarCamera() {
            try {
                // Pede permissão para usar a webcam e o microfone
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                // Joga o vídeo da sua câmera no elemento <video> da página
                localVideo.srcObject = stream;
            } catch (erro) {
                alert("Não foi possível acessar sua webcam. Verifique as permissões do navegador.");
                console.error(erro);
            }
        }

        // Executa a função assim que a página carrega
        iniciarCamera();
    </script>

</body>
</html>
