<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Fotos</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .photo-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.4);
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .photo-info {
            padding: 15px;
        }

        .photo-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .photo-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <h1>Minha Galeria</h1>
        <p>Um espaço para compartilhar meus momentos e memórias.</p>
    </header>

    <main class="gallery-container">
        <!-- FOTO 1 -->
        <div class="photo-card">
            <img src="fotos/foto1.jpg" alt="Descrição da foto 1">
            <div class="photo-info">
                <h3>Título da Foto 1</h3>
                <p>Uma breve legenda ou data sobre este momento.</p>
            </div>
        </div>

        <!-- FOTO 2 -->
        <div class="photo-card">
            <img src="fotos/foto2.jpg" alt="Descrição da foto 2">
            <div class="photo-info">
                <h3>Título da Foto 2</h3>
                <p>Uma breve legenda ou data sobre este momento.</p>
            </div>
        </div>

        <!-- FOTO 3 -->
        <div class="photo-card">
            <img src="fotos/foto3.jpg" alt="Descrição da foto 3">
            <div class="photo-info">
                <h3>Título da Foto 3</h3>
                <p>Uma breve legenda ou data sobre este momento.</p>
            </div>
        </div>

        <!-- Para adicionar mais fotos, basta copiar e colar um bloco "photo-card" acima -->
    </main>

    <footer>
        <p>&copy; 2026 - Criado com GitHub Pages</p>
    </body>
</html>
